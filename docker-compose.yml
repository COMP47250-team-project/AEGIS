services:
  # ─────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-appdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────
  # FastAPI backend (auto-reload)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Run migrations then start the server; alembic reads DATABASE_URL_SYNC (sync driver)
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"
    environment:
      # asyncpg (async engine used by the app)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-appdb}
      # psycopg2 (sync engine used by Alembic migrations)
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-appdb}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_to_a_random_64_char_string}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      APP_ENV: development
      LOG_LEVEL: DEBUG
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # hot-reload: mount source into container
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Vite frontend (HMR)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app # hot-reload: mount source into container
      - frontend_node_modules:/app/node_modules # keep container modules isolated
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(5173,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Azurite — Azure Storage emulator
  # ─────────────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command: >
      azurite
        --blobHost 0.0.0.0
        --queueHost 0.0.0.0
        --tableHost 0.0.0.0
        --loose
        --skipApiVersionCheck
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(10000,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────
  # Ollama — local AI twin (optional)
  # Provides OpenAI-compatible /v1 API for 1A/1B/1C when Azure creds are absent.
  # Enable by setting OLLAMA_BASE_URL=http://ollama:11434/v1 in the backend env.
  #
  # One-time model pull (run after `docker compose up -d ollama`):
  #   docker exec -it aegis-ollama-1 ollama pull qwen3:8b
  #   docker exec -it aegis-ollama-1 ollama pull nomic-embed-text
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ─────────────────────────────────────────
# Named volumes — all wiped by `down -v`
# ─────────────────────────────────────────
volumes:
  postgres_data:
  azurite_data:
  frontend_node_modules:
  ollama_data: # Ollama model cache (local AI twin for 1A/1B/1C)
