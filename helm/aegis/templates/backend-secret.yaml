{{- if .Values.secret.create }}
# LOCAL-only Secret with throwaway dev values (mirrors docker-compose.yml).
# On AKS, secret.create is false and this Secret is applied out-of-band by the
# deploy workflow (real managed-Azure connection strings from GitHub secrets),
# so real credentials are never rendered from chart values or committed.
#
# Service Bus is intentionally omitted locally — the backend publish path is
# guarded on an empty connection string, and docker-compose runs without it.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    {{- include "aegis.selectorLabels" "backend" | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  JWT_SECRET_KEY: {{ .Values.secret.jwtSecretKey | quote }}
  AZURE_STORAGE_CONNECTION_STRING: {{ .Values.secret.azureStorageConnectionString | quote }}
  {{- with .Values.secret.azureServiceBusConnectionString }}
  AZURE_SERVICE_BUS_CONNECTION_STRING: {{ . | quote }}
  {{- end }}
{{- end }}
