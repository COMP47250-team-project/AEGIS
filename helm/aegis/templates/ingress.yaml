# Two hostnames, not path-based routing: the backend mounts routers at root
# (/auth, /admin, /exams, /student, /ws, ...) with no common /api prefix, and
# the SPA ALSO owns /admin and /student as client-side routes — they collide on
# a single host. So: app host -> frontend, api host -> backend.
#
# The long proxy timeouts keep telemetry WebSockets (/ws/exam, /ws/professor)
# alive; the app pings every ~30s, well within, but we set 3600s so idle
# sessions never get cut by the proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.wsProxyTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.wsProxyTimeout | quote }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.appHost | quote }}
        - {{ .Values.ingress.apiHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.appHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
