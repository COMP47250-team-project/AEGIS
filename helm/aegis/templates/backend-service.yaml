apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    {{- include "aegis.selectorLabels" "backend" | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aegis.selectorLabels" "backend" | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
