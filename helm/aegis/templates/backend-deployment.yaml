# AEGIS backend — FastAPI on uvicorn (:8000).
#
# CMD override: the image's default CMD couples `alembic upgrade head &&
# uvicorn ...`, which races when replicas > 1. Migrations run once via the
# migrate Job (migrate-job.yaml); here we run uvicorn only.
# --proxy-headers/--forwarded-allow-ips let the app see the external https
# scheme behind a TLS-terminating ingress (affects Secure-cookie behaviour).
#
# Probes: readiness hits /healthz (returns 503 until the DB is reachable, so
# traffic is withheld until migrations+DB are up). Liveness is a bare TCP
# check — NOT /healthz — so a transient DB blip doesn't trigger a restart storm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    {{- include "aegis.selectorLabels" "backend" | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" "backend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" "backend" | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if .Values.localServices.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.localServices.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U {{ .Values.localServices.postgres.user }} -d {{ .Values.localServices.postgres.database }}; do
                echo "waiting for postgres..."; sleep 2;
              done
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
