# One-shot DB migration — runs `alembic upgrade head` using the SAME backend
# image, decoupled from the backend Deployment so migrations run exactly once
# regardless of replica count.
#
# IMPORTANT: alembic/env.py reads DATABASE_URL (the asyncpg async URL), NOT
# DATABASE_URL_SYNC — so backend-secret must carry DATABASE_URL. WORKDIR /app is
# baked into the image, which is where alembic.ini + alembic/ live.
#
# Re-run semantics: a Job's pod template is immutable, so `kubectl apply` over a
# still-present completed Job with a NEW image is a no-op (won't re-migrate).
# ttlSecondsAfterFinished (below) deletes the Job 300s after completion, so a
# later `kubectl apply -k` recreates it and it re-runs on the new image. To
# force an immediate re-run: `kubectl delete job migrate -n aegis` then re-apply.
# See k8s/README.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 2;
              done
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
      containers:
        - name: migrate
          image: aegis-backend # overlays set newName + newTag (same as backend)
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
