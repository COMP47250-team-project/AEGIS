# Two hostnames, not path-based routing: the backend mounts routers at root
# (/auth, /admin, /exams, /student, /ws, ...) with no common /api prefix, and
# the SPA ALSO owns /admin and /student as client-side routes — they collide on
# a single host. So: app host -> frontend, api host -> backend.
#
# Hostnames are placeholders here; each overlay patches them (nip.io locally,
# real DNS + TLS on AKS). The long proxy timeouts keep telemetry WebSockets
# (/ws/exam, /ws/professor) alive; the app pings every ~30s, well within, but
# we set 3600s so idle sessions never get cut by the proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: app.aegis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.aegis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
