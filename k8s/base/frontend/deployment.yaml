# AEGIS frontend — the Vite build served by nginx (frontend/Dockerfile.prod),
# health at /health (nginx.conf). VITE_API_URL is baked at BUILD time, so each
# overlay builds its own image pointing at that environment's api host; there
# is no runtime env injection for the SPA.
#
# Runs as root: stock nginx:stable-alpine binds privileged port 80 as the
# master process, so runAsNonRoot would crash it. Switching to
# nginxinc/nginx-unprivileged (:8080) is a documented later cleanup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: aegis-frontend # overlays set newName + newTag
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
